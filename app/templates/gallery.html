<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Verse Archive</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="gallery-page">
<main class="dashboard-shell">
  <section class="hero-panel">
    <div class="hero-copy">
      <div class="brand-lockup">
        <span class="brand-badge" aria-hidden="true">&#10013;</span>
        <div>
          <p class="section-kicker">Daily Verse Studio</p>
          <h1>Verse Archive</h1>
        </div>
      </div>
    </div>

    <div class="hero-metrics">
      <article class="metric-card">
        <span class="metric-label">Verse Days</span>
        <strong id="statDays">0</strong>
      </article>
      <article class="metric-card">
        <span class="metric-label">Images Loaded</span>
        <strong id="statImages">0</strong>
      </article>
      <article class="metric-card">
        <span class="metric-label">Current Page</span>
        <strong id="statPage">1</strong>
      </article>
    </div>
  </section>

  <section class="workspace-panel">
    <div class="workspace-top">
      <div>
        <p class="section-kicker">Archive</p>
        <h2>Daily Verse Gallery</h2>
        <p class="workspace-copy" id="resultsSummary" aria-live="polite">
          Loading...
        </p>
      </div>

      <div class="workspace-actions">
        <button id="prevBtn" class="ghost-button" type="button" onclick="prev()">Previous</button>
        <span class="page-pill" id="pageIndicator">Page 1</span>
        <button id="nextBtn" class="ghost-button accent-button" type="button" onclick="next()">Next</button>
      </div>
    </div>

    <div class="gallery" id="gallery"></div>
  </section>
</main>

<div id="modal" class="image-modal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" type="button" onclick="closeModal()" aria-label="Close preview">&times;</button>

    <div class="modal-media">
      <img id="fullImage" alt="Selected verse artwork">
    </div>

    <div class="modal-side">
      <p class="section-kicker">Preview</p>
      <h3 id="modalTitle">Verse artwork</h3>
      <p id="modalMeta" class="modal-copy">
        Opened image details.
      </p>

      <div class="modal-actions">
        <a id="download" class="primary-link" href="#">Download PNG</a>
        <button id="deleteBtn" class="danger-button" type="button" onclick="deleteImage()">Delete Day</button>
      </div>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
